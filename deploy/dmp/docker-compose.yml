# One DMP container per asset (ADR-012). The config directory is mounted at
# /usr/share/config (the executable's default config path). Override
# JAVA_OPTS for JVM sizing (default -Xmx512m).
services:
  dmp-<asset>:
    image: eclipsebasyx/databridge:1.0.0-SNAPSHOT
    container_name: dmp-<asset>
    volumes:
      - ./config:/usr/share/config
    environment:
      - JAVA_OPTS=-Xmx512m
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 localhost:8085/health || exit 1
      interval: 20s
      retries: 3
      start_period: 10s
      timeout: 10s
