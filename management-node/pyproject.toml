[project]
name = "aas-dmp-management-node"
version = "0.1.0"
description = "Management node for aas-camel-dmp: reacts to AAS events, parses AID+AIMC, compiles DMP descriptors and deploys per-asset DMP containers (SPEC §11, ADR-013, ADR-016)."
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "requests>=2.31",
    "pydantic>=2.6",
    # Shared AAS data-model package (ADR-016): parses AID/AIMC through the same
    # pydantic models the registration service authors them with. Self-contained
    # (bundles aas_pydantic + IDTA templates + resource templates + MQTTSchemas).
    "aas-model>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
